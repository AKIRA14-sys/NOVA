name: Build NOVA Browser ARM64 APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using persistent GitHub Release Keystore Secret"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "KEYSTORE_PASS=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "GitHub Release Keystore secret not set. Generating temporary runner release keystore for CI verification..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias nova \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass novabrowserpass \
              -keypass novabrowserpass \
              -dname "CN=NOVA Browser, OU=Mobile, O=NOVA, L=City, S=State, C=US"
            echo "KEYSTORE_PASS=novabrowserpass" >> $GITHUB_ENV
            echo "ALIAS=nova" >> $GITHUB_ENV
            echo "KEY_PASS=novabrowserpass" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build ARM64 Release APK
        env:
          KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ env.ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Verify APK Signature & ARM64 Architecture
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Release APK was not generated!"
            exit 1
          fi

          echo "Found APK at: $APK_PATH"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "APK Filename: $(basename $APK_PATH)"
          echo "APK Size: ${SIZE_MB} MB ($SIZE_BYTES bytes)"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Verifying signature using $APKSIGNER..."
          $APKSIGNER verify --verbose "$APK_PATH" || { echo "Error: APK Signature Verification Failed!"; exit 1; }

          echo "Verifying ARM64 native architecture contents..."
          unzip -l "$APK_PATH" | grep "lib/arm64-v8a/" || { echo "Error: Missing arm64-v8a native libraries!"; exit 1; }

          # Ensure no unwanted secondary ABIs are present
          UNWANTED=$(unzip -l "$APK_PATH" | grep -E "lib/(armeabi-v7a|x86|x86_64)/" || true)
          if [ -n "$UNWANTED" ]; then
            echo "Error: Found non-ARM64 native libraries in APK!"
            echo "$UNWANTED"
            exit 1
          fi
          echo "APK verification successful! Valid signed ARM64 release build confirmed."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-browser-arm64-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release for Tagged Versions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
